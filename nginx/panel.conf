# ==============================================================================
# HostPanel — Nginx ön yüz (reverse proxy)
# Panel, port 80'in default_server'ıdır: sunucunun IP'si veya henüz özel vhost'u
# olmayan herhangi bir host adı panele düşer. Böylece kurulumdan hemen sonra
# http://SUNUCU_IP ile panele erişilir; sabit domain/IP gerektirmez.
# Müşteri domainleri kendi vhost'larıyla (aşağıdaki include) eşleşir.
# ==============================================================================

# Musteri domain vhostlarini dahil et.
include /etc/nginx/vhosts/*.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # API proxy - backend'e yonlendir
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # WebSocket destegi (socket.io)
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend - Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# CATCH-ALL: eşleşmeyen HTTPS isteklerini reddet.
# Bir domain'in 443 (SSL) bloğu yoksa, istek buraya düşer ve 444 ile kapatılır;
# böylece başka bir müşterinin sitesi (default SSL vhost) ASLA sızmaz.
# SSL'siz yeni eklenen tüm domainler bu sayede korunur.
# ==============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 444;
}
