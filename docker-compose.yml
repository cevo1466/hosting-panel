# ==============================================================================
# HostPanel — Docker Compose (üretim)
# TÜM gizli/kişiye özel değerler .env dosyasından okunur. Bu dosyada hiçbir
# sabit IP, domain, parola veya anahtar BULUNMAZ. .env'i install.sh üretir.
# Container içi servis adları (mysql/redis) ağ-içi sabittir, kullanıcı ayarı değildir.
# ==============================================================================

services:
  mysql:
    image: mariadb:10.11
    container_name: hosting_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD .env icinde tanimli olmali}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hosting_panel}
      MYSQL_USER: ${MYSQL_USER:-panel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD .env icinde tanimli olmali}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hosting-network

  redis:
    image: redis:7-alpine
    container_name: hosting_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD .env icinde tanimli olmali}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hosting-network

  backend:
    build:
      context: ./backend
    image: hostpanel-backend
    container_name: hosting_backend
    restart: always
    # Host systemd servislerine (php-fpm, postfix, dovecot, vsftpd, bind, ...)
    # nsenter --target 1 ile erişebilmek için gereklidir.
    privileged: true
    pid: host
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-file:/var/www/hosting_panel.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env icinde tanimli olmali}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL .env icinde tanimli olmali}
      SERVER_IP: ${SERVER_IP:?SERVER_IP .env icinde tanimli olmali}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASS: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WEB_ROOT: /var/www
      NGINX_SITES_AVAILABLE: /var/www/nginx-vhosts
      NGINX_SITES_ENABLED: /var/www/nginx-vhosts
      PHP_FPM_SOCK_DIR: /var/run/php
      FTP_USERLIST_FILE: ${FTP_USERLIST_FILE:-/etc/vsftpd.userlist}
      MAIL_BASE: /var/mail/vhosts
      BACKUP_BASE: /var/backups/hosting
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - /var/www:/var/www
      - /var/www/nginx-vhosts:/var/www/nginx-vhosts
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/run/php:/var/run/php
      - /etc/dovecot:/etc/dovecot
      - /etc/vsftpd:/etc/vsftpd
      - /etc/bind:/etc/bind
      - /var/mail:/var/mail
      - backups:/var/backups/hosting
    networks:
      - hosting-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WEBMAIL_URL: ${NEXT_PUBLIC_WEBMAIL_URL:-}
    image: hostpanel-frontend
    container_name: hosting_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - hosting-network

  nginx:
    image: nginx:1.25-alpine
    container_name: hosting_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/panel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /var/www:/var/www
      - /var/www/nginx-vhosts:/etc/nginx/vhosts:ro
      - /var/run/php:/var/run/php
      - /etc/letsencrypt:/etc/letsencrypt
      - nginx_logs:/var/log/nginx
    networks:
      - hosting-network

volumes:
  mysql_data:
    name: hostpanel_mysql_data
  redis_data:
    name: hostpanel_redis_data
  backups:
    name: hostpanel_backups
  nginx_logs:
    name: hostpanel_nginx_logs

networks:
  hosting-network:
    name: hostpanel_hosting-network
    driver: bridge
